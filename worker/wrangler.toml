name = "sfo-hyd-flight-check"
main = "index.js"
compatibility_date = "2026-10-01"

# Scheduled at midnight/noon UTC. Works even while your laptop is off.
[triggers]
crons = ["0 0,12 * * *"]

[vars]
ALLOWED_ORIGIN = "https://YOUR_USERNAME.github.io"
ALERT_PRICE_USD = "1500"
# An 8-pair rotating scheduled batch, capped at 15 API calls per run.
# Monthly allowances: 900 automatic + 100 manual requests. These are protective
# soft counters, not transactional financial controls.
PAIRS_PER_RUN = "8"
MONTHLY_REQUEST_CAP = "1000"
MANUAL_REQUEST_CAP = "100"
AUTO_CALLS_PER_RUN = "15"
STOP_AFTER_DATE = "2026-11-27"

# Add a Cloudflare KV namespace using the CLI after creating one:
# [[kv_namespaces]]
# binding = "FARE_STORE"
# id = "YOUR_KV_NAMESPACE_ID"
